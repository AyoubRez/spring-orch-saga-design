server.port=8080

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.kafka.bootstrap-servers=localhost:9091,localhost:9092,localhost:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=orders-ms
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Step 2 : Add Core module to trusted packages
# this configuration property is used when your application is consuming JSON messages from kafka
# when JSON message is consumed , it needs to be deserialized, or it needs to be converted back into java object
# So this property it tells Deserializer which packages it can trust to create Java objects from
spring.kafka.consumer.properties.spring.json.trusted.packages=com.appsdeveloperblog.core.*

# Step 7 : Define orders-events topic
orders.events.topic.name=orders-events
products.commands.topic.name=products-commands